<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Registration</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            padding: 20px;
            margin: 0;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
        }

        h2 {
            margin-top: 30px;
            border-bottom: 2px solid #333;
            padding-bottom: 8px;
        }

        label {
            display: block;
            margin-top: 12px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #aaa;
            border-radius: 5px;
            font-size: 15px;
        }

        textarea {
            resize: vertical;
        }

        .gender {
            display: flex;
            gap: 15px;
        }

        .gender label {
            font-weight: normal;
        }

        .gender input {
            width: auto;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            border: none;
            border-radius: 5px;
            background: #333;
            color: white;
            font-size: 16px;
        }

        button:hover {
            background: #555;
        }

        .error {
            color: red;
            font-size: 13px;
        }

        .success {
            color: green;
            text-align: center;
            font-weight: bold;
            margin-top: 15px;
        }

        .history-item {
            background: #f1fff1;
            border-left: 4px solid green;
            padding: 12px;
            margin-top: 10px;
            border-radius: 5px;
        }

        .delete {
            background: #d9534f;
            width: auto;
            padding: 6px 12px;
            margin-top: 8px;
            font-size: 13px;
        }

        .clear {
            background: #555;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Student Registration Form</h1>

    <form id="registrationForm">

        <label>Full Name</label>
        <input
            type="text"
            id="name"
            placeholder="Enter your full name"
        >
        <div id="nameError" class="error"></div>


        <label>Email</label>
        <input
            type="email"
            id="email"
            placeholder="Enter your email"
        >
        <div id="emailError" class="error"></div>


        <label>Phone Number</label>
        <input
            type="text"
            id="phone"
            placeholder="Enter 10-digit phone number"
        >
        <div id="phoneError" class="error"></div>


        <label>Date of Birth</label>
        <input type="date" id="dob">
        <div id="dobError" class="error"></div>


        <label>Gender</label>

        <div class="gender">

            <label>
                <input type="radio" name="gender" value="Male">
                Male
            </label>

            <label>
                <input type="radio" name="gender" value="Female">
                Female
            </label>

            <label>
                <input type="radio" name="gender" value="Other">
                Other
            </label>

        </div>

        <div id="genderError" class="error"></div>


        <label>Password</label>
        <input
            type="password"
            id="password"
            placeholder="Enter password"
        >
        <div id="passwordError" class="error"></div>


        <label>Confirm Password</label>
        <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm password"
        >
        <div id="confirmError" class="error"></div>


        <label>Address</label>

        <textarea
            id="address"
            rows="4"
            placeholder="Enter your address"
        ></textarea>

        <div id="addressError" class="error"></div>


        <button type="submit">
            Register
        </button>

        <div id="successMessage" class="success"></div>

    </form>


    <!-- HISTORY -->

    <h2>Registration History</h2>

    <div id="history">
        <p>No student has completed registration yet.</p>
    </div>

    <button
        type="button"
        class="clear"
        onclick="clearHistory()">
        Clear History
    </button>

</div>


<script>

    // Array to store registered students
    let students = [];


    // Load previously saved students
    try {

        let savedStudents =
            localStorage.getItem("students");

        if (savedStudents) {
            students = JSON.parse(savedStudents);
        }

    } catch (error) {

        students = [];

    }


    // =====================================
    // FORM SUBMISSION
    // =====================================

    document
        .getElementById("registrationForm")
        .addEventListener("submit", function(event) {

            event.preventDefault();


            // Clear errors

            document
                .querySelectorAll(".error")
                .forEach(function(error) {
                    error.innerHTML = "";
                });


            document
                .getElementById("successMessage")
                .innerHTML = "";


            let valid = true;


            // Get values

            let name =
                document.getElementById("name").value.trim();

            let email =
                document.getElementById("email").value.trim();

            let phone =
                document.getElementById("phone").value.trim();

            let dob =
                document.getElementById("dob").value;

            let password =
                document.getElementById("password").value;

            let confirmPassword =
                document.getElementById("confirmPassword").value;

            let address =
                document.getElementById("address").value.trim();

            let gender =
                document.querySelector(
                    'input[name="gender"]:checked'
                );


            // =====================================
            // VALIDATION
            // =====================================

            if (name === "") {

                document.getElementById("nameError").innerHTML =
                    "Please enter your name.";

                valid = false;
            }


            if (email === "") {

                document.getElementById("emailError").innerHTML =
                    "Please enter your email.";

                valid = false;

            } else {

                let emailPattern =
                    /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

                if (!emailPattern.test(email)) {

                    document.getElementById("emailError").innerHTML =
                        "Enter a valid email.";

                    valid = false;
                }
            }


            if (phone === "") {

                document.getElementById("phoneError").innerHTML =
                    "Please enter your phone number.";

                valid = false;

            } else if (!/^[0-9]{10}$/.test(phone)) {

                document.getElementById("phoneError").innerHTML =
                    "Phone number must contain 10 digits.";

                valid = false;
            }


            if (dob === "") {

                document.getElementById("dobError").innerHTML =
                    "Please select your date of birth.";

                valid = false;
            }


            if (!gender) {

                document.getElementById("genderError").innerHTML =
                    "Please select your gender.";

                valid = false;
            }


            if (password === "") {

                document.getElementById("passwordError").innerHTML =
                    "Please enter a password.";

                valid = false;
            }


            if (confirmPassword === "") {

                document.getElementById("confirmError").innerHTML =
                    "Please confirm your password.";

                valid = false;

            } else if (password !== confirmPassword) {

                document.getElementById("confirmError").innerHTML =
                    "Passwords do not match.";

                valid = false;
            }


            if (address === "") {

                document.getElementById("addressError").innerHTML =
                    "Please enter your address.";

                valid = false;
            }


            // =====================================
            // REGISTRATION SUCCESS
            // =====================================

            if (valid) {

                let student = {

                    name: name,

                    date:
                        new Date().toLocaleString()

                };


                // Add student to array

                students.push(student);


                // Save to browser

                try {

                    localStorage.setItem(
                        "students",
                        JSON.stringify(students)
                    );

                } catch (error) {

                    console.log(
                        "Could not save history."
                    );

                }


                // Show success message

                document
                    .getElementById("successMessage")
                    .innerHTML =
                    "Registration Successful!";


                // Reset form

                document
                    .getElementById("registrationForm")
                    .reset();


                // IMPORTANT:
                // Update history immediately

                displayHistory();

            }

        });


    // =====================================
    // DISPLAY HISTORY
    // =====================================

    function displayHistory() {

        let history =
            document.getElementById("history");


        history.innerHTML = "";


        if (students.length === 0) {

            history.innerHTML =
                "<p>No student has completed registration yet.</p>";

            return;
        }


        students.forEach(function(student, index) {

            let item =
                document.createElement("div");

            item.className = "history-item";


            item.innerHTML =
                "✓ <strong>" +
                student.name +
                "</strong> completed registration." +
                "<br>" +
                "<small>Registered on: " +
                student.date +
                "</small>";


            let deleteButton =
                document.createElement("button");

            deleteButton.innerHTML = "Delete";

            deleteButton.className = "delete";


            deleteButton.onclick = function() {

                deleteStudent(index);

            };


            item.appendChild(deleteButton);

            history.appendChild(item);

        });

    }


    // =====================================
    // DELETE STUDENT
    // =====================================

    function deleteStudent(index) {

        students.splice(index, 1);


        try {

            localStorage.setItem(
                "students",
                JSON.stringify(students)
            );

        } catch (error) {

            console.log("Save error.");

        }


        displayHistory();

    }


    // =====================================
    // CLEAR HISTORY
    // =====================================

    function clearHistory() {

        if (
            confirm(
                "Do you want to delete all registration history?"
            )
        ) {

            students = [];


            try {

                localStorage.removeItem("students");

            } catch (error) {

                console.log("Storage error.");

            }


            displayHistory();

        }

    }


    // =====================================
    // SHOW HISTORY WHEN PAGE OPENS
    // =====================================

    displayHistory();

</script>

</body>
</html>
